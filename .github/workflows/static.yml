name: Validate site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pull-request-validation:
    name: Pull request validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Tailwind CSS is up to date
        run: |
          npm run build:tailwind
          git diff --exit-code -- assets/tailwind.css
      - name: Run site tests
        run: npm test
      - name: Validate static HTML, links, and security controls
        run: npm run validate:static

  production-smoke:
    name: Production smoke test
    needs: pull-request-validation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://irondillo.com
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@v5
      - name: Check the canonical production site
        id: smoke
        env:
          DOMAIN: irondillo.com
        run: |
          set -o pipefail
          if scripts/smoke-production.sh 2>&1 | tee production-smoke.log; then
            echo "### Production smoke test passed for https://${DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            echo "::error title=Production smoke test failed::See the job log and production-smoke-log artifact for details."
            echo "### Production smoke test failed for https://${DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Upload production smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-log
          path: production-smoke.log
          if-no-files-found: error
